version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. Service Discovery: Spring Cloud Netflix Eureka
  # ---------------------------------------------------------------------------
  eureka-server:
    image: openjdk:17-slim
    container_name: hydrowatch-eureka
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8761
    restart: always

  # ---------------------------------------------------------------------------
  # 2. Apache Kafka & Zookeeper Event Streaming
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: hydrowatch-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: hydrowatch-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # ---------------------------------------------------------------------------
  # 3. MeterSeries Microservice (Telemetry & JPA Persistence)
  # ---------------------------------------------------------------------------
  meterseries-service:
    build:
      context: ./meterseries-service
    container_name: hydrowatch-meterseries
    depends_on:
      - eureka-server
    ports:
      - "8081:8081"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_PROFILES_ACTIVE=docker

  # ---------------------------------------------------------------------------
  # 4. Baseline Service (Baseline Calculation, Anomaly Evaluation, Kafka Publish)
  # ---------------------------------------------------------------------------
  baseline-service:
    build:
      context: ./baseline-service
    container_name: hydrowatch-baseline
    depends_on:
      - eureka-server
      - kafka
    ports:
      - "8082:8082"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPIC_ANOMALY=soa.s10.t02.events

  # ---------------------------------------------------------------------------
  # 5. LeakCase Microservice (Kafka Consumer, Deduplication, Case JPA Store)
  # ---------------------------------------------------------------------------
  leakcase-service:
    build:
      context: ./leakcase-service
    container_name: hydrowatch-leakcase
    depends_on:
      - eureka-server
      - kafka
    ports:
      - "8083:8083"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPIC_ANOMALY=soa.s10.t02.events

  # ---------------------------------------------------------------------------
  # 6. Spring Cloud API Gateway
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: ./api-gateway
    container_name: hydrowatch-gateway
    depends_on:
      - eureka-server
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
